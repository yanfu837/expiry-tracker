{% extends 'expiry/base.html' %}
{% block title %}Add expiry item{% endblock %}
{% block content %}
<section class="panel form-panel">
    <h1>Add expiry item</h1>
    {% include 'expiry/document_assistant.html' %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% include 'expiry/form_fields.html' %}
        <div class="actions"><button type="submit">Save</button><a href="{% url 'dashboard' %}">Cancel</a></div>
    </form>
</section>
{% endblock %}
