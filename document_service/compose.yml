services:
  document-processor:
    build:
      context: ..
      dockerfile: document_service/Dockerfile
    ports:
      - "127.0.0.1:10001:10000"
    environment:
      DOCUMENT_PROCESSOR_TOKEN: ${DOCUMENT_PROCESSOR_TOKEN:?Set a random token of at least 32 characters}
      OCR_LANGUAGES: eng+chi_tra
    volumes:
      - clamav-database:/var/lib/clamav
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2
    pids_limit: 64
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
volumes:
  clamav-database:
