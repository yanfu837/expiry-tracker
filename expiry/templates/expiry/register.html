<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>

<body>

    <h1>Create account</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Register
        </button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'login' %}">Log in</a>
    </p>

</body>
</html>
